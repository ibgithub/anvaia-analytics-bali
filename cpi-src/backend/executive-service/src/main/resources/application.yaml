server:
  port: 8082

spring:
  application:
    name: executive-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:cpi}}
    username: ${DB_USER:ml_user}
    password: ${DB_PASSWORD:ml_user}
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: ${KEYCLOAK_CLIENT_ID:ml-dashboard}
            client-secret: ${KEYCLOAK_CLIENT_SECRET:wPPDQM0EIeQ8UNlnb1p3Qh73yIQMxVTl}
            scope: openid, profile, email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
        provider:
          keycloak:
            issuer-uri: ${KEYCLOAK_ISSUER_URI:https://aihub.bprks.local/auth/realms/master}
jwt:
  secret: ${JWT_SECRET:my-super-secret-key-minimum-32-bytes!!!}
  expiration: 3600000 # 1 jam
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://cpi.teman-umkm.com,http://cpi.teman-umkm.com,http://localhost:3000,http://localhost:5173,http://192.168.76.214:8080,https://192.168.76.214:8080,http://localhost,https://localhost}