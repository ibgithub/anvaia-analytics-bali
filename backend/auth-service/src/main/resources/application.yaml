server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:anvaia-bali}}
    username: ${DB_USER:anvaia}
    password: ${DB_PASSWORD:anvaia}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    default-schema: auth
    schemas: auth,ods,public

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-minimum-32-bytes!!!}
  expiration: 3600000 # 1 jam
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://cpi.teman-umkm.com,http://cpi.teman-umkm.com,http://localhost:3000,http://localhost:5173,http://localhost:5174,http://192.168.76.214:8080,https://192.168.76.214:8080,http://localhost,https://localhost}