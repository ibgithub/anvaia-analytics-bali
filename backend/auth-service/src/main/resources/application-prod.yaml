server:
  port: 9091

spring:
  application:
    name: auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${DB_HOST:127.0.0.1}:${DB_PORT:5432}/${DB_NAME:cpi}}
    username: ${DB_USER:ml_user}
    password: ${DB_PASSWORD:ml_user}
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
    default-schema: auth
    schemas: auth,ods,public

jwt:
  secret: ${JWT_SECRET:my-super-secret-key-minimum-32-bytes!!!}
  expiration: 3600000 # 1 jam
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger
    operationsSorter: method
    tagsSorter: alpha
    display-request-duration: true

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:https://cpi.teman-umkm.com,http://cpi.teman-umkm.com,http://localhost:3000,http://192.168.76.214:8080,https://192.168.76.214:8080}

logging:
  file:
    name: /home/oper/dashboard/backend/logs/auth-service.log
  level:
    com.ib.auth: INFO
    org.springframework.web: WARN
