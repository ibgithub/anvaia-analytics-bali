services:
  auth-service:
    build:
      context: ./cpi-src/backend/auth-service
      dockerfile: Dockerfile
    container_name: cpi-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8081}:8081"
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-cpi}
      - DB_USER=${DB_USER:-ml_user}
      - DB_PASSWORD=${DB_PASSWORD:-ml_user}
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET:-my-super-secret-key-minimum-32-bytes!!!}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://cpi.teman-umkm.com,http://cpi.teman-umkm.com,http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cpi-network

  executive-service:
    build:
      context: ./cpi-src/backend/executive-service
      dockerfile: Dockerfile
    container_name: cpi-executive-service
    restart: unless-stopped
    ports:
      - "${EXECUTIVE_PORT:-8082}:8082"
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-cpi}
      - DB_USER=${DB_USER:-ml_user}
      - DB_PASSWORD=${DB_PASSWORD:-ml_user}
      - JWT_SECRET=${JWT_SECRET:-my-super-secret-key-minimum-32-bytes!!!}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://cpi.teman-umkm.com,http://cpi.teman-umkm.com,http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - cpi-network

  frontend:
    build:
      context: ./cpi-src/frontend
      dockerfile: Dockerfile
    container_name: cpi-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - auth-service
      - executive-service
    networks:
      - cpi-network

networks:
  cpi-network:
    driver: bridge
