services:
  postgres:
    image: postgres:16-alpine
    container_name: anvaia-bali-postgres
    restart: unless-stopped
    ports:
      - "${DB_EXTERNAL_PORT:-5433}:5432"
    environment:
      - POSTGRES_DB=${DB_NAME:-anvaia_bali}
      - POSTGRES_USER=${DB_USER:-anvaia}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-anvaia}
    volumes:
      - anvaia-bali-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-anvaia} -d ${DB_NAME:-anvaia_bali}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - anvaia-bali-network

  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: anvaia-bali-auth-service
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-8091}:8081"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-anvaia_bali}
      - DB_USER=${DB_USER:-anvaia}
      - DB_PASSWORD=${DB_PASSWORD:-anvaia}
      - FLYWAY_ENABLED=${FLYWAY_ENABLED:-true}
      - JWT_SECRET=${JWT_SECRET:-my-super-secret-key-minimum-32-bytes!!!}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://anvaia-bali.teman-umkm.com,http://anvaia-bali.teman-umkm.com,http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anvaia-bali-network

  executive-service:
    build:
      context: ./backend/executive-service
      dockerfile: Dockerfile
    container_name: anvaia-bali-executive-service
    restart: unless-stopped
    ports:
      - "${EXECUTIVE_PORT:-8092}:8082"
    environment:
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_NAME=${DB_NAME:-anvaia_bali}
      - DB_USER=${DB_USER:-anvaia}
      - DB_PASSWORD=${DB_PASSWORD:-anvaia}
      - JWT_SECRET=${JWT_SECRET:-my-super-secret-key-minimum-32-bytes!!!}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-https://anvaia-bali.teman-umkm.com,http://anvaia-bali.teman-umkm.com,http://localhost,http://localhost:80,http://localhost:5173,http://localhost:3000}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - anvaia-bali-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: anvaia-bali-frontend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      - auth-service
      - executive-service
    networks:
      - anvaia-bali-network

volumes:
  anvaia-bali-pgdata:

networks:
  anvaia-bali-network:
    driver: bridge
